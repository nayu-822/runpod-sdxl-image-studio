name: Publish Docker and update RunPod template

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runpod-production-deploy
  cancel-in-progress: true

jobs:
  freshness:
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )

    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.verify-main.outputs.deploy }}
      sha: ${{ steps.version.outputs.sha }}
      short_sha: ${{ steps.version.outputs.short_sha }}

    steps:
      - name: Resolve commit SHA
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="$GITHUB_SHA"
          fi

          SHORT_SHA="${SHA:0:7}"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          echo "Deploying commit $SHORT_SHA"

      - name: Verify deploy commit is current main
        id: verify-main
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ steps.version.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          main_ref_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main"
          response="$(curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${main_ref_url}")"
          current_sha="$(python -c 'import json, sys; print(json.load(sys.stdin)["object"]["sha"])' <<<"${response}")"

          if [[ -z "${current_sha}" || "${current_sha}" == "null" ]]; then
            echo "Could not resolve the current main SHA" >&2
            exit 1
          fi

          if [[ "${TARGET_SHA}" != "${current_sha}" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale deploy ${TARGET_SHA}; current main is ${current_sha}"
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "Current main matches deploy target ${TARGET_SHA}"

  deploy:
    needs: freshness
    if: >-
      needs.freshness.result == 'success' &&
      needs.freshness.outputs.deploy == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.freshness.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:${{ needs.freshness.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update RunPod template image
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_TEMPLATE_ID: ${{ vars.RUNPOD_TEMPLATE_ID }}
          IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:${{ needs.freshness.outputs.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          api_key = os.environ["RUNPOD_API_KEY"]
          template_id = os.environ["RUNPOD_TEMPLATE_ID"]
          image_name = os.environ["IMAGE_NAME"]

          base_url = "https://rest.runpod.io/v1/templates"

          headers = {
              "Authorization": f"Bearer {api_key}",
              "Content-Type": "application/json",
          }

          # 現在のTemplateを取得する。
          request = urllib.request.Request(
              f"{base_url}/{template_id}",
              headers=headers,
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              current = json.load(response)

          # RunPod Templateの現在値を維持し、
          # imageNameだけを新しいimmutable tagへ変更する。
          fields = (
              "containerDiskInGb",
              "containerRegistryAuthId",
              "dockerEntrypoint",
              "dockerStartCmd",
              "env",
              "imageName",
              "isPublic",
              "name",
              "ports",
              "readme",
              "volumeInGb",
              "volumeMountPath",
          )

          payload = {
              key: current[key]
              for key in fields
              if key in current and current[key] is not None
          }

          payload["imageName"] = image_name

          data = json.dumps(
              payload,
              separators=(",", ":"),
          ).encode("utf-8")

          request = urllib.request.Request(
              f"{base_url}/{template_id}/update",
              data=data,
              headers=headers,
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              updated = json.load(response)

          if updated.get("imageName") != image_name:
              raise RuntimeError(
                  "RunPod template update returned an unexpected imageName"
              )

          print(
              f"RunPod template {template_id} updated to {image_name}"
          )
          PY

      - name: Deployment summary
        run: |
          echo "### Docker / RunPod deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ needs.freshness.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Short SHA: \`${{ needs.freshness.outputs.short_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Docker image: \`${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:${{ needs.freshness.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Also published: \`:latest\`" >> "$GITHUB_STEP_SUMMARY"
