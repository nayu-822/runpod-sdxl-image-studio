[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runpod-sdxl-image-studio"
version = "0.1.0"
description = "A private Gradio front end for SDXL image generation on a RunPod ComfyUI backend."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "RunPod SDXL Image Studio contributors"}]
dependencies = [
    "alembic>=1.13,<2.0",
    # Gradio 6 moves Blocks CSS to launch(); Phase 1A keeps CSS in build_app().
    "gradio>=5.0.0,<6.0.0",
    "httpx>=0.27,<1.0",
    "pillow>=10.0,<13.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "websockets>=12.0,<16.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=5.0,<8.0",
    "respx>=0.21,<1.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
runpod-sdxl-image-studio = "runpod_sdxl_image_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
runpod_sdxl_image_studio = ["ui/assets/*.svg"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".git", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = [
    "integration: tests that exercise multiple local application layers",
]

[tool.coverage.run]
branch = true
source = ["runpod_sdxl_image_studio"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
